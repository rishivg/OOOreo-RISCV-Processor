# riscv-formal check generator config for OOOreo (RV32IM, 2-wide retire).
# Run:  ./fetch.sh && make   (genchecks.py reads this and emits per-check .sby)
[options]
isa rv32im
nret 2
ilen 32
compr_en 0          ; no C extension (RV32IM)
csr_en 0            ; core models no CSRs
align_pc 4          ; 4-byte instruction alignment (no compressed)
buserror_en 0

[depth]
insn   12           ; per-instruction consistency (cheap; start here)
reg    12
pc_fwd 12
pc_bwd 12
liveness 1 25       ; deep OoO state -> liveness is expensive, raise gradually
unique 1 12
causal 12
mem   1 16

[defines]
`define RISCV_FORMAL
`define RISCV_FORMAL_NRET 2
`define RISCV_FORMAL_XLEN 32
`define RISCV_FORMAL_ILEN 32
`define RISCV_FORMAL_ALIGNED_MEM

[verilog]
rvfi_wrapper.sv
# cpu_rvfi + RTL: generated by ../gen_rtl_flat.sh (sv2v flatten of the core +
# the rvfi port exposure described in rvfi_wrapper.sv). Listed by the Makefile.
